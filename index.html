class DisplaySurface 
{
    constructor(name, origin, u_vector, v_vector) 
    {
        this.name = name;
        this.origin = origin;
        this.u = u_vector;
        this.v = v_vector;
    }

	viewMatrix(eye)
	{
        var uHat = this.u.clone().normalize();
        var vHat = this.v.clone().normalize();

        var nHat = new THREE.Vector3().crossVectors(uHat, vHat).normalize();

        var mat = new THREE.Matrix4();

        mat.set(
            uHat.x, uHat.y, uHat.z, -uHat.dot(eye),
            vHat.x, vHat.y, vHat.z, -vHat.dot(eye),
            nHat.x, nHat.y, nHat.z, -nHat.dot(eye),
            0,      0,      0,      1
        );

        return mat;
	}
	
    frustumParameters(eye, znear)
    {
        // 1. Orthonormal basis of the display surface
        const uHat = this.u.clone().normalize();
        const vHat = this.v.clone().normalize();

        const nHat = new THREE.Vector3().crossVectors(uHat, vHat).normalize();

        // 2. Vector from the eye to the screen origin
        const a = this.origin.clone().sub(eye);

        // 3. Perpendicular distance to the screen plane
        const d = -a.dot(nHat);

        // 4. Scale from screen plane to near clipping plane
        const scale = znear / d;

        // 5. Off-axis frustum boundaries
        const left   = a.dot(uHat) * scale;
        const right  = left + this.u.length() * scale;
        const bottom = a.dot(vHat) * scale;
        const top    = bottom + this.v.length() * scale;

        return { left, right, bottom, top };
    }

    projectionMatrix(eye, znear, zfar)
    {
        const { left, right, bottom, top } = this.frustumParameters(eye, znear);
        return new THREE.Matrix4().makePerspective(left, right, top, bottom, znear, zfar);
    }
}

function addDragControlToObjects()
{

function createEyeScene()
{
    var IPD = 6.8; 
    eyeCenter = new THREE.Vector3(50, 20, 50);
    // eye positions relative to the head
    var eyeL = new THREE.Vector3( - IPD/2, 10, -6);
    var eyeR = new THREE.Vector3( + IPD/2, 10, -6);
    
    eyeScene = new THREE.Scene();

    // add sphere representing head
    var geometry = new THREE.SphereGeometry( 10, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xaaaaaa } );
    var head = new THREE.Mesh( geometry, material );
    head.name = "Head";
    head.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z);
    eyeScene.add(head);

    // add spheres representing L/R eyes
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xff0000 } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeL";
    sphere.position.set(eyeL.x, eyeL.y, eyeL.z);
    head.add(sphere);
	
    var geometry = new THREE.SphereGeometry( 3, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0x0000ff } );
    var sphere = new THREE.Mesh( geometry, material );
    sphere.name = "EyeR";
    sphere.position.set(eyeR.x, eyeR.y, eyeR.z);
	head.add(sphere);
    
    createLights(eyeScene);
}

function createRenderer()
{
    renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: false
    });

    renderer.autoClear = false;
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Enable WebXR
    renderer.xr.enabled = true;

    // Use floor-level tracking when supported
    renderer.xr.setReferenceSpaceType('local-floor');

    document.body.appendChild(renderer.domElement);

    // Add the Enter VR button
    document.body.appendChild(VRButton.createButton(renderer));
}

function onWindowResize()
{
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
}

function enableOrbitCamera(cam, renderer)
{
    orbitControl = new OrbitControls(cam, renderer.domElement );
    orbitControl.minDistance = 0;
    orbitControl.maxDistance = 50000;
}

function createLights(scn)
{
    var ambientLight = new THREE.AmbientLight(0x888888, 0.7 * Math.PI);
    scn.add(ambientLight);

    // No distance attenuation: the simulator uses scene units at a large scale.
    var pointLight = new THREE.PointLight(0xffffff, 0.8 * Math.PI, 0, 0);
    pointLight.position.z += 200;
    scn.add(pointLight);
}

function createScene()
{
    scene = new THREE.Scene();

    var geometry = new TeapotGeometry( 40, 15);
    var material = new THREE.MeshPhongMaterial( { color: 0xffffff } );
    var teapot = new THREE.Mesh(geometry, material);
    teapot.name = "Teapot";
    teapot.position.z-=70;
    scene.add( teapot );

    // Sphere: center on the front screen plane (zero parallax)
    const sphereGeometry = new THREE.SphereGeometry(18, 32, 24);
    const sphereMaterial = new THREE.MeshPhongMaterial({
        color: 0xffffff
    });

    const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
    sphere.name = "Sphere";
    sphere.position.set(-80, 15, -150);

    scene.add(sphere);


    // Cube: behind the front screen (positive parallax)
    const cubeGeometry = new THREE.BoxGeometry(32, 32, 32);
    const cubeMaterial = new THREE.MeshPhongMaterial({
        color: 0xdddddd
    });

    const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
    cube.name = "Cube";
    cube.position.set(75, -20, -205);
    cube.rotation.set(0.3, 0.5, 0);

    scene.add(cube);
                
    createLights(scene);
}

const birdClock = new THREE.Clock();

function loadBirdModel()
{
    const loader = new GLTFLoader();

    loader.load(
        'models/Flamingo.glb',

        function(gltf)
        {
            const bird = gltf.scene;

            bird.name = "Bird";
            bird.position.set(-45, 45, -110);
            bird.scale.setScalar(0.25);

            scene.add(bird);

            // Play the first animation, if available
            if (gltf.animations.length > 0)
            {
                birdMixer = new THREE.AnimationMixer(bird);
                birdMixer.clipAction(gltf.animations[0]).play();
            }

            console.log("Bird loaded successfully!");
            console.log("Animations:", gltf.animations.length);
        },

        undefined,

        function(error)
        {
            console.error("Error loading bird:", error);
        }
    );
}

// create a scene with 3D objects representing the display surfaces
function createDisplaySurfaceScene()
{
    displaySurfaceScene = new THREE.Scene();

    // add display surfaces
    for (var [index, displaySurface] of displaySurfaces.entries())
    {
        var origin = displaySurface.origin;
        var u = displaySurface.u;
        var v = displaySurface.v;

        var geometry = new THREE.BoxGeometry(u.length(), v.length(), 0.01);
        var material = new THREE.MeshBasicMaterial( {map: displaySurfaceTargets[index].texture} );
        var cube = new THREE.Mesh( geometry, material );
        cube.name = displaySurface.name;
        if (displaySurface.name == "Left")
            cube.rotation.y = Math.PI / 2;

		if (displaySurface.name == "Right")
            cube.rotation.y = - Math.PI / 2;
			
		if (displaySurface.name == "Floor")
		{
            cube.rotation.x =  Math.PI / 2;
			cube.rotation.z =  Math.PI ;
		}
        var uHalf = u.clone().multiplyScalar(0.5);
		var vHalf = v.clone().multiplyScalar(0.5);
		var center = new THREE.Vector3().addVectors(origin, uHalf);
		center.add(vHalf);
		cube.position.set(center.x, center.y, center.z);
		
        displaySurfaceScene.add(cube);
    }
    
    createLights(displaySurfaceScene);
}

function createDisplaySurfaceTargets()
{
    const SIZE = 1024;  // texture resolution
    displaySurfaceTargets = [];
    
    for (var v of displaySurfaces)       
        displaySurfaceTargets.push(new THREE.WebGLRenderTarget(SIZE, SIZE));
}

function getLeftEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeL");
    return eye.getWorldPosition(new THREE.Vector3());
}

function getRightEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeR");
    return eye.getWorldPosition(new THREE.Vector3());
}

function cameraFromViewProj(view, proj)
{
    // 1. Clone the original camera
    const cam = camera.clone();
    // 2. Convert the view matrix into a camera world matrix
    const cameraWorldMatrix = view.clone().invert();
    // 3. Extract position and orientation
    cam.position.setFromMatrixPosition(cameraWorldMatrix);
    cam.quaternion.setFromRotationMatrix(cameraWorldMatrix);
    // 4. Assign the projection matrix and its inverse
    cam.projectionMatrix.copy(proj);
    cam.projectionMatrixInverse.copy(proj).invert();
    // 5. Update the world transformation
    cam.updateMatrixWorld(true);

    return cam;
}

function updateParallaxReadout()
{
    const readout = document.getElementById("parallaxInfo");
    const teapot = scene.getObjectByName("Teapot");

    if (!readout || !teapot) return;

    // 1. Get the front display surface
    const front = displaySurfaces.find(surface => surface.name === "Front");
    // 2. Current eye positions
    const eyeL = getLeftEyePosition();
    const eyeR = getRightEyePosition();
    // 3. Current teapot world position
    const teapotPos = teapot.getWorldPosition(new THREE.Vector3());

    // 4. Create stereoscopic cameras
    const camL = cameraFromViewProj(front.viewMatrix(eyeL), front.projectionMatrix(eyeL, 1, 10000));
    const camR = cameraFromViewProj(front.viewMatrix(eyeR), front.projectionMatrix(eyeR, 1, 10000));

    // 5. Project the teapot center into NDC
    const projectedL = teapotPos.clone().project(camL);
    const projectedR = teapotPos.clone().project(camR);

    // 6. Compute horizontal disparity in centimeters
    const width = front.u.length();

    const disparity = (projectedR.x - projectedL.x) * width / 2;

    // 7. Signed distance relative to the screen plane
    const uHat = front.u.clone().normalize();
    const vHat = front.v.clone().normalize();

    const normal = new THREE.Vector3()
        .crossVectors(uHat, vHat)
        .normalize();

    const offset = teapotPos.clone()
        .sub(front.origin)
        .dot(normal);

    var status = "";
    var color = "#ffffff";

    const tolerance = 0.01; // cm

    if (Math.abs(disparity) < tolerance) {
        status = "ZERO (On screen)";
        color = "#ffff00";
    }
    else if (disparity < 0) {
        status = "NEGATIVE (In front)";
        color = "#ff4444";
    }
    else {
        status = "POSITIVE (Behind)";
        color = "#00ff88";
    }

    // 9. Update the interface
    readout.textContent = `${status} | Disparity: ${disparity.toFixed(3)} cm` + ` | Screen offset: ${offset.toFixed(1)} cm`;
    readout.style.color = color;
}

const XR_SCALE = 0.01;
const XR_OFFSET = new THREE.Vector3(0, 1.5, -1);

let xrDebugPrinted = false;

function renderXRScene()
{
    // 1. Scenes defined in centimeters
    const scenes = [
        scene,
        displaySurfaceScene,
        eyeScene
    ];

    // 2. Save their original transformations
    const originals = scenes.map(scn => ({
        position: scn.position.clone(),
        scale: scn.scale.clone()
    }));

    try
    {
        // 3. Convert centimeters to meters
        for (const scn of scenes)
        {
            scn.position.multiplyScalar(XR_SCALE);
            scn.position.add(XR_OFFSET);

            scn.scale.multiplyScalar(XR_SCALE);
            scn.updateMatrixWorld(true);
        }

        // 4. Debug: physical positions in WebXR
        if (!xrDebugPrinted)
        {
            const floor = displaySurfaceScene.getObjectByName("Floor");
            const front = displaySurfaceScene.getObjectByName("Front");
            const teapot = scene.getObjectByName("Teapot");

            console.log("=== WEBXR SCALE DEBUG ===");
            console.log("Expected CAVE size: 3 x 3 x 3 meters");

            console.table([
                {
                    Object: "Floor center",
                    Position: floor.getWorldPosition(
                        new THREE.Vector3()
                    ).toArray()
                },
                {
                    Object: "Front center",
                    Position: front.getWorldPosition(
                        new THREE.Vector3()
                    ).toArray()
                },
                {
                    Object: "Teapot",
                    Position: teapot.getWorldPosition(
                        new THREE.Vector3()
                    ).toArray()
                }
            ]);

            xrDebugPrinted = true;
        }

        // 5. Render using the WebXR headset cameras
        renderer.setRenderTarget(null);
        renderer.setClearColor(0x303030);
        renderer.clear();

        if (showScene) {
            renderer.render(scene, camera);
        }

        renderer.render(displaySurfaceScene, camera);

    }
    finally
    {
        // 6. Restore the centimeter-based transformations
        scenes.forEach((scn, i) => {
            scn.position.copy(originals[i].position);
            scn.scale.copy(originals[i].scale);
            scn.updateMatrixWorld(true);
        });
    }
}

// refresh function
var animate = function () {
    var gl = renderer.getContext();
    //requestAnimationFrame(animate);

    const delta = birdClock.getDelta();

    if (birdMixer) {
        birdMixer.update(delta);
    }

    updateParallaxReadout();

    // WebXR rendering
    if (renderer.xr.isPresenting)
    {
        renderXRScene();
        return;
    }

    // 1. render scene objects
	renderer.setClearColor(0x808080);
    renderer.clear();
    if (showScene)
        renderer.render(scene, camera);
    
    // 2. render scene objects onto a texture, for each target
    for (let [index, displaySurface] of displaySurfaces.entries())
    {
        renderer.setRenderTarget(displaySurfaceTargets[index]);
        renderer.setClearColor(0x404040);
        renderer.clear();

		// left eye on RED channel
        gl.colorMask(1, 0, 0, 0); 
		var eye = getLeftEyePosition();
		var view = displaySurface.viewMatrix(eye);
		var proj = displaySurface.projectionMatrix(eye, 1, 10000);
        var leftCamera = cameraFromViewProj(view, proj);
        renderer.render(scene, leftCamera); 
    
		// right eye on GREEN, BLUE channels
		gl.colorMask(0, 1, 1, 0);
		var eye = getRightEyePosition();
		var view = displaySurface.viewMatrix(eye);
		var proj = displaySurface.projectionMatrix(eye, 1, 10000);
        var rightCamera = cameraFromViewProj(view, proj);
        renderer.clearDepth();
        renderer.render(scene, rightCamera); 
		
        gl.colorMask(1, 1, 1, 1);
    }
    // restore state
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000);
    // 3. render display surfaces as (textured) quads
    renderer.render(displaySurfaceScene, camera);
	
	// 4. render eyes
    renderer.render(eyeScene, camera);
	
};

// Debug Functions
function debugViewMatrices()
{
    const eye = new THREE.Vector3(50, 20, 100);

    // Expected matrices from the assignment
    const expected = {
        Front: [
            [1, 0, 0, -50],
            [0, 1, 0, -20],
            [0, 0, 1, -100],
            [0, 0, 0, 1]
        ],
        Left: [
            [0, 0, -1, 100],
            [0, 1, 0, -20],
            [1, 0, 0, -50],
            [0, 0, 0, 1]
        ],
        Right: [
            [0, 0, 1, -100],
            [0, 1, 0, -20],
            [-1, 0, 0, 50],
            [0, 0, 0, 1]
        ]
    };

    const tolerance = 1e-6;

    for (const surface of displaySurfaces)
    {
        if (!expected[surface.name]) continue;

        const matrix = surface.viewMatrix(eye);

        // Three.js stores Matrix4 elements in column-major order.
        // Convert them to rows for comparison with the assignment.
        const actual = [];

        for (let i = 0; i < 4; i++)
        {
            actual[i] = [];

            for (let j = 0; j < 4; j++)
            {
                actual[i][j] = matrix.elements[j * 4 + i];
            }
        }

        let maxError = 0;

        for (let i = 0; i < 4; i++)
        {
            for (let j = 0; j < 4; j++)
            {
                const error = Math.abs(
                    actual[i][j] - expected[surface.name][i][j]
                );

                maxError = Math.max(maxError, error);
            }
        }

        const passed = maxError < tolerance;

        console.log(`\n=== ${surface.name} VIEW MATRIX ===`);

        console.table(actual.map((row, i) => ({
            Row: i,
            C0: row[0],
            C1: row[1],
            C2: row[2],
            C3: row[3]
        })));

        console.log(
            `${passed ? "PASS" : "FAIL"} | Maximum error: ${maxError}`
        );

        console.assert(
            passed,
            `${surface.name} view matrix differs from expected result!`
        );
    }
}

                        depthRow,
                        lastRow
                    ]
                }
            }
        }
    ];

    const tolerance = 1e-5;

    for (const test of tests)
    {
        console.group(test.name);

        for (const surface of displaySurfaces)
        {
            const expected = test.expected[surface.name];
            if (!expected) continue;

            // Calculate actual frustum parameters
            const frustum = surface.frustumParameters(
                test.eye, test.near
            );

            const actualBounds = [
                frustum.left,
                frustum.right,
                frustum.bottom,
                frustum.top
            ];

            const boundsError = Math.max(
                ...actualBounds.map((value, i) =>
                    Math.abs(value - expected.bounds[i])
                )
            );

            // Calculate actual projection matrix
            const matrix = surface.projectionMatrix(
                test.eye, test.near, test.far
            );

            // Convert Three.js column-major storage to rows
            const actualMatrix = [];

            for (let row = 0; row < 4; row++)
            {
                actualMatrix[row] = [];

                for (let col = 0; col < 4; col++)
                {
                    actualMatrix[row][col] =
                        matrix.elements[col * 4 + row];
                }
            }

            let matrixError = 0;

            for (let row = 0; row < 4; row++)
            {
                for (let col = 0; col < 4; col++)
                {
                    matrixError = Math.max(
                        matrixError,
                        Math.abs(
                            actualMatrix[row][col] -
                            expected.matrix[row][col]
                        )
                    );
                }
            }

            const passed =
                boundsError < tolerance &&
                matrixError < tolerance;

            console.log(`=== ${surface.name} ===`);

            console.table([{
                left: frustum.left,
                right: frustum.right,
                bottom: frustum.bottom,
                top: frustum.top,
                near: test.near,
                far: test.far
            }]);

            console.table(actualMatrix.map((row, i) => ({
                Row: i,
                C0: row[0],
                C1: row[1],
                C2: row[2],
                C3: row[3]
            })));

            console.log(
                `${passed ? "PASS" : "FAIL"} | ` +
                `Frustum error: ${boundsError} | ` +
                `Matrix error: ${matrixError}`
            );

            console.assert(
                passed,
                `${surface.name}: Projection test failed!`
            );
        }

        console.groupEnd();
    }
}

function debugRenderingCameras()
{
    const eye = new THREE.Vector3(50, 20, 100);
    const znear = 0.1;
    const zfar = 100;

    const tolerance = 1e-6;
    const results = [];

    // Maximum absolute difference between two matrices
    function matrixError(A, B)
    {
        let error = 0;

        for (let i = 0; i < 16; i++)
        {
            error = Math.max(
                error,
                Math.abs(A.elements[i] - B.elements[i])
            );
        }

        return error;
    }

    for (const surface of displaySurfaces)
    {
        // 1. Our mathematical matrices
        const view = surface.viewMatrix(eye);
        const proj = surface.projectionMatrix(eye, znear, zfar);

        // 2. Create the Three.js camera
        const cam = cameraFromViewProj(view, proj);
        cam.updateMatrixWorld(true);

        // 3. Compare the matrices
        const viewError = matrixError(
            cam.matrixWorldInverse, view
        );

        const projectionError = matrixError(
            cam.projectionMatrix, proj
        );

        // 4. Project the four screen corners
        const combined = new THREE.Matrix4()
            .multiplyMatrices(
                cam.projectionMatrix,
                cam.matrixWorldInverse
            );

        const corners = [
            { point: surface.origin.clone(), expected: [-1, -1] },

            { point: surface.origin.clone().add(surface.u),
                expected: [1, -1] },

            { point: surface.origin.clone().add(surface.v),
                expected: [-1, 1] },

            { point: surface.origin.clone().add(surface.u).add(surface.v),
                expected: [1, 1] }
        ];

        let cornerError = 0;

        for (const corner of corners)
        {
            // applyMatrix4 includes the perspective division
            const ndc = corner.point.applyMatrix4(combined);

            cornerError = Math.max(
                cornerError,
                Math.abs(ndc.x - corner.expected[0]),
                Math.abs(ndc.y - corner.expected[1])
            );
        }

        const passed =
            viewError < tolerance &&
            projectionError < tolerance &&
            cornerError < tolerance;

        results.push({
            Surface: surface.name,
            ViewError: viewError.toExponential(2),
            ProjectionError: projectionError.toExponential(2),
            CornerError: cornerError.toExponential(2),
            Result: passed ? "PASS" : "FAIL"
        });
    }

    console.log("=== THREE.JS CAMERA TEST ===");
    console.table(results);
}

function debugStereoProjection()
{
    const front = displaySurfaces.find(
        surface => surface.name === "Front"
    );

    const eyeL = getLeftEyePosition();
    const eyeR = getRightEyePosition();

    const znear = 1;
    const zfar = 10000;

    // Create left and right cameras
    const camL = cameraFromViewProj(
        front.viewMatrix(eyeL),
        front.projectionMatrix(eyeL, znear, zfar)
    );

    const camR = cameraFromViewProj(
        front.viewMatrix(eyeR),
        front.projectionMatrix(eyeR, znear, zfar)
    );

    // Screen width, eye separation and distance
    const width = front.u.length();
    const IPD = eyeR.x - eyeL.x;
    const D = eyeL.z - front.origin.z;

    // Three test points at different depths
    const teapot = scene.getObjectByName("Teapot");

    const points = [
        {
            name: "Teapot",
            position: teapot.getWorldPosition(
                new THREE.Vector3()
            )
        },
        {
            name: "On screen",
            position: new THREE.Vector3(0, 0, -150)
        },
        {
            name: "Behind screen",
            position: new THREE.Vector3(0, 0, -200)
        }
    ];

    const results = [];

    for (const point of points)
    {
        // Project into Normalized Device Coordinates
        const projectedL = point.position.clone()
            .project(camL);

        const projectedR = point.position.clone()
            .project(camR);

        // Convert NDC horizontal difference to cm
        const disparity = (
            projectedR.x - projectedL.x
        ) * width / 2;

        // Theoretical disparity
        const Z = eyeL.z - point.position.z;

        const theoretical = IPD * (1 - D / Z);

        const error = Math.abs(
            disparity - theoretical
        );

        let parallax;

        if (Math.abs(disparity) < 1e-6) {
            parallax = "ZERO";
        }
        else if (disparity < 0) {
            parallax = "NEGATIVE";
        }
        else {
            parallax = "POSITIVE";
        }

        results.push({
            Object: point.name,
            Z: point.position.z,
            LeftNDC: projectedL.x.toFixed(5),
            RightNDC: projectedR.x.toFixed(5),
            DisparityCm: disparity.toFixed(5),
            ExpectedCm: theoretical.toFixed(5),
            Parallax: parallax,
            Result: error < 1e-6 ? "PASS" : "FAIL"
        });
    }

    console.log("=== STEREO PROJECTION TEST ===");
    console.log("Left eye:", eyeL.toArray());
    console.log("Right eye:", eyeR.toArray());
    console.log("IPD:", IPD, "cm");

    console.table(results);
}
