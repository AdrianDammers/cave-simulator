<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CAVE simulator</title>
<link type="text/css" rel="stylesheet" href="main.css">
</head>
<body>
<div id="info">
    CAVE Simulator. The head, teapot, and birds are draggable. <br />
    "L" See from Left Eye | "R" See from Right Eye | "S" toggle show scene  <br />
    IPD: <input type="range" id="ipdSlider" min="2" max="15" step="0.5" value="6.8"> <span id="ipdVal">6.8</span> cm <br />
    <strong>Parallax Mode / Status:</strong> <span id="parallaxInfo" style="color: #00ff88;">Calculating...</span>
</div>

<!-- Check: https://threejs.org/docs/index.html#manual/en/introduction/Installation 
for alternative installations -->

<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { DragControls } from 'three/addons/controls/DragControls.js';
import { TeapotGeometry } from 'three/addons/geometries/TeapotGeometry.js';
import { VRButton } from 'three/addons/webxr/VRButton.js';
import { loadBird } from './Bird.js';

class DisplaySurface 
{
    constructor(name, origin, u_vector, v_vector) 
    {
        this.name = name;
        this.origin = origin;
        this.u = u_vector;
        this.v = v_vector;
    }

	viewMatrix(eye)
	{
		var vrp = new THREE.Vector3().addVectors(this.origin, this.u.clone().multiplyScalar(0.5)).add(this.v.clone().multiplyScalar(0.5));
		var normal = new THREE.Vector3().crossVectors(this.u, this.v).normalize();
		var dist = eye.clone().sub(vrp).dot(normal);
		var target = eye.clone().sub(normal.clone().multiplyScalar(dist));
		var upVector = this.v.clone().normalize();

		var mat = new THREE.Matrix4();
		mat.lookAt(eye, target, upVector);
		var translate = new THREE.Matrix4().makeTranslation(-eye.x, -eye.y, -eye.z);
		mat.multiplyMatrices(mat, translate);
		return mat;
	}
	
    projectionMatrix(eye, znear, zfar)
    {
        var uHat = this.u.clone().normalize();
		var vHat = this.v.clone().normalize();
		var wHat = new THREE.Vector3().crossVectors(uHat, vHat).normalize();

		var p0 = this.origin.clone().sub(eye);
		var p1 = this.origin.clone().add(this.u).sub(eye);
		var p2 = this.origin.clone().add(this.v).sub(eye);

		var lScreen = p0.dot(uHat);
		var rScreen = p1.dot(uHat);
		var bScreen = p0.dot(vHat);
		var tScreen = p2.dot(vHat);
		var d = -p0.dot(wHat);

		var left = (lScreen * znear) / d;
		var right = (rScreen * znear) / d;
		var bottom = (bScreen * znear) / d;
		var top = (tScreen * znear) / d;

        return new THREE.Matrix4().makePerspective(left, right, top, bottom, znear, zfar);
    }
}

function updateParallaxReadout() {
    if (!scene) return; 
    var teapot = scene.getObjectByName("Teapot");
    var readoutElem = document.getElementById("parallaxInfo");
    if (!teapot || !readoutElem) return;

    var teapotPos = teapot.getWorldPosition(new THREE.Vector3());
    var frontScreenOrigin = new THREE.Vector3(-150.0, -150.0, -150.0);
    var screenZ = frontScreenOrigin.z; 
    var depthDiff = teapotPos.z - screenZ; 

    var statusText = "";
    var color = "#ffffff";

    if (Math.abs(depthDiff) < 2.0) {
        statusText = "Zero Parallax (On Screen Plane)";
        color = "#ffff00"; 
    } else if (teapotPos.z > screenZ) {
        statusText = "Negative Parallax (Pop-out / In front)";
        color = "#ff4444"; 
    } else {
        statusText = "Positive Parallax (Behind screen depth)";
        color = "#00ff88"; 
    }

    readoutElem.innerText = statusText + " (Z-offset: " + depthDiff.toFixed(1) + " cm)";
    readoutElem.style.color = color;
}

var renderer, scene, camera;
var displaySurfaces, displaySurfaceScene, displaySurfaceTargets;
var eyeCenter, eyeScene; 
var orbitControl;
var showScene = true;

// Shared clock and collection array for multiple animated bird updaters
var animationClock = new THREE.Clock();
var birdUpdaters = [];

function setupDragControls()
{
    var objects = [];
    var teapot = scene.getObjectByName("Teapot");
    var head = eyeScene.getObjectByName("Head");
    var torus = scene.getObjectByName("LeftTorus");
    var crystal = scene.getObjectByName("RightCrystal");
    var cone = scene.getObjectByName("FrontCone");

    if (teapot) objects.push(teapot);
    if (head) objects.push(head);
    if (torus) objects.push(torus);
    if (crystal) objects.push(crystal);
    if (cone) objects.push(cone);
    
    // Automatically catch all loaded birds inside the scene
    scene.traverse((child) => {
        if (child.isGroup && child.name.startsWith("Bird_")) {
            objects.push(child);
        }
    });
	
    var controls = new DragControls( objects, camera, renderer.domElement );
    controls.addEventListener( 'hoveron', function ( event ) 
		{
            orbitControl.enabled = false;
        } );
    controls.addEventListener( 'hoveroff', function ( event ) 
	{
            orbitControl.enabled = true;
    } );
	controls.addEventListener( 'dragstart', function ( event ) 
		{
            // Traverse meshes inside grouped objects to highlight them on drag
            event.object.traverse((child) => {
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => { if(m.emissive) m.emissive.set(0xaaaaaa); });
                    } else if (child.material.emissive) {
                        child.material.emissive.set(0xaaaaaa);
                    }
                }
            });
        } );
    controls.addEventListener( 'dragend', function ( event ) 
		{
            event.object.traverse((child) => {
                if (child.material) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => { if(m.emissive) m.emissive.set(0x000000); });
                    } else if (child.material.emissive) {
                        child.material.emissive.set(0x000000);
                    }
                }
            });
    } );
}

function createEyeScene()
{
    var IPD = 6.8; 
    eyeCenter = new THREE.Vector3(50, 20, 50);
    var eyeL = new THREE.Vector3( - IPD/2, 10, -6);
    var eyeR = new THREE.Vector3( + IPD/2, 10, -6);
    
    eyeScene = new THREE.Scene();

    var geometry = new THREE.SphereGeometry( 10, 32, 22 );
    var material = new THREE.MeshPhongMaterial( { color: 0xaaaaaa } );
    var head = new THREE.Mesh( geometry, material );
    head.name = "Head";
    head.position.set(eyeCenter.x, eyeCenter.y, eyeCenter.z);
    eyeScene.add(head);

    var geometryL = new THREE.SphereGeometry( 3, 32, 22 );
    var materialL = new THREE.MeshPhongMaterial( { color: 0xff0000 } );
    var sphereL = new THREE.Mesh( geometryL, materialL );
    sphereL.name = "EyeL";
    sphereL.position.set(eyeL.x, eyeL.y, eyeL.z);
    head.add(sphereL);
	
    var geometryR = new THREE.SphereGeometry( 3, 32, 22 );
    var materialR = new THREE.MeshPhongMaterial( { color: 0x0000ff } );
    var sphereR = new THREE.Mesh( geometryR, materialR );
    sphereR.name = "EyeR";
    sphereR.position.set(eyeR.x, eyeR.y, eyeR.z);
	head.add(sphereR);
    
    createLights(eyeScene);
}

function createRenderer()
{
    renderer = new THREE.WebGLRenderer({preserveDrawingBuffer: true});
    renderer.autoClear = false;
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true; 
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));
}

function onWindowResize()
{
    const width = window.innerWidth;
    const height = window.innerHeight;

    camera.aspect = width / height;
    camera.updateProjectionMatrix();
    renderer.setSize(width, height);
}

function enableOrbitCamera(cam, renderer)
{
    orbitControl = new OrbitControls(cam, renderer.domElement );
    orbitControl.minDistance = 0;
    orbitControl.maxDistance = 50000;
}

function createLights(scn)
{
    var ambientLight = new THREE.AmbientLight(0x888888, 0.7 * Math.PI);
    scn.add(ambientLight);

    var pointLight = new THREE.PointLight(0xffffff, 0.8 * Math.PI, 0, 0);
    pointLight.position.z += 200;
    scn.add(pointLight);
}

function createScene()
{
    scene = new THREE.Scene();

    var geometry = new TeapotGeometry( 30, 15);
    var material = new THREE.MeshPhongMaterial( { color: 0xffffff } );
    var teapot = new THREE.Mesh(geometry, material);
    teapot.name = "Teapot";
    teapot.position.set(0, 0, -40);
    scene.add( teapot );

    var torusGeometry = new THREE.TorusGeometry(20, 7, 16, 100);
    var torusMaterial = new THREE.MeshPhongMaterial({ color: 0x00ff88, shininess: 100 });
    var torus = new THREE.Mesh(torusGeometry, torusMaterial);
    torus.name = "LeftTorus";
    torus.position.set(-70, 20, -80);
    torus.rotation.x = Math.PI / 4;
    //scene.add(torus);

    var icoGeometry = new THREE.IcosahedronGeometry(25, 0);
    var icoMaterial = new THREE.MeshPhongMaterial({ color: 0x3388ff, flatShading: true });
    var ico = new THREE.Mesh(icoGeometry, icoMaterial);
    ico.name = "RightCrystal";
    ico.position.set(70, -10, -120);
    //scene.add(ico);

    var coneGeometry = new THREE.ConeGeometry(18, 45, 32);
    var coneMaterial = new THREE.MeshPhongMaterial({ color: 0xffdd00 });
    var cone = new THREE.Mesh(coneGeometry, coneMaterial);
    cone.name = "FrontCone";
    cone.position.set(0, -45, -10);
    //scene.add(cone);
                
    createLights(scene);
}

function createDisplaySurfaceScene()
{
    displaySurfaceScene = new THREE.Scene();

    for (var [index, displaySurface] of displaySurfaces.entries())
    {
        var origin = displaySurface.origin;
        var u = displaySurface.u;
        var v = displaySurface.v;
  
        var geometry = new THREE.BoxGeometry(u.length(), v.length(), 0.01);
        var material = new THREE.MeshBasicMaterial( {map: displaySurfaceTargets[index].texture} );
        var cube = new THREE.Mesh( geometry, material );
        cube.name = displaySurface.name;

        if (displaySurface.name === "Floor") {
            var gridHelper = new THREE.GridHelper(300, 10, 0xffffff, 0x555555);
            gridHelper.rotation.x = Math.PI / 2; 
            gridHelper.position.z = -0.02; 
            cube.add(gridHelper);
        }
        if (displaySurface.name == "Left")
            cube.rotation.y = Math.PI / 2;
       
		if (displaySurface.name == "Right")
            cube.rotation.y = - Math.PI / 2;
			
		if (displaySurface.name == "Floor")
		{
            cube.rotation.x =  Math.PI / 2;
			cube.rotation.z =  Math.PI ;
		}
       
	    var uHalf = u.clone().multiplyScalar(0.5);
		var vHalf = v.clone().multiplyScalar(0.5);
		var center = new THREE.Vector3().addVectors(origin, uHalf);
		center.add(vHalf);
		cube.position.set(center.x, center.y, center.z);
		
        displaySurfaceScene.add(cube);
    }
    
    createLights(displaySurfaceScene);
}

function createDisplaySurfaceTargets()
{
    const SIZE = 1024;  
    displaySurfaceTargets = [];
    
    for (var v of displaySurfaces)       
        displaySurfaceTargets.push(new THREE.WebGLRenderTarget(SIZE, SIZE));
}

function createCamera()
{
    camera = new THREE.PerspectiveCamera( 75, window.innerWidth/window.innerHeight, 0.1, 10000 );
    camera.position.set( 100, 100, 300 );
    camera.lookAt( 0, 0, 0 );
}

function createDisplaySurfaces()
{
    displaySurfaces = [];
    var frontScreen = new DisplaySurface("Front", 
        new THREE.Vector3(-150.0, -150.0, -150.0), 
        new THREE.Vector3(300.0, 0.0,   0.0), 
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(frontScreen);

    var leftScreen = new DisplaySurface("Left",
        new THREE.Vector3(-150.0, -150.0, 150.0), 
        new THREE.Vector3(0.0, 0.0,  -300.0), 
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(leftScreen);
	
    var rightScreen = new DisplaySurface("Right",
        new THREE.Vector3(150.0, -150.0, -150.0), 
        new THREE.Vector3(0.0, 0.0,  300.0), 
        new THREE.Vector3(0.0, 300.0,   0.0));
    displaySurfaces.push(rightScreen);

    var floorScreen = new DisplaySurface("Floor",
        new THREE.Vector3(-150.0, -150.0, -150.0),
        new THREE.Vector3(300.0, 0.0, 0.0), 
        new THREE.Vector3(0.0, 0.0, 300.0));
    displaySurfaces.push(floorScreen);
}

function getLeftEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeL");
    return eye.getWorldPosition(new THREE.Vector3());
}

function getRightEyePosition()
{
    var eye = eyeScene.getObjectByName("EyeR");
    return eye.getWorldPosition(new THREE.Vector3());
}

function cameraFromViewProj(view, proj)
{
	var cam = camera.clone();
    var inv = new THREE.Matrix4();
	inv.copy(view).invert();
	cam.position.set(inv.elements[12], inv.elements[13], inv.elements[14]);
	cam.setRotationFromMatrix(view);
	cam.projectionMatrix = proj.clone();
	return cam;
}

var animate = function () {
    var gl = renderer.getContext();
    var delta = animationClock.getDelta();

    // Update all loaded birds using the shared frame delta
    for (let tick of birdUpdaters) {
        tick(delta);
    }

    updateParallaxReadout();

    // 1. render scene objects
	renderer.setClearColor(0x808080);
    renderer.clear();
    if (showScene)
        renderer.render(scene, camera);
    
    // 2. render scene objects onto a texture, for each target
    for (let [index, displaySurface] of displaySurfaces.entries())
    {
        renderer.setRenderTarget(displaySurfaceTargets[index]);

        if (displaySurface.name === "Floor") {
            renderer.setClearColor(0x2a3b4c); 
        } else {
            renderer.setClearColor(0x404040); 
        }

        renderer.clear();

        gl.colorMask(1, 0, 0, 0); 
		var eyeLPos = getLeftEyePosition();
		var viewL = displaySurface.viewMatrix(eyeLPos);
		var projL = displaySurface.projectionMatrix(eyeLPos, 1, 10000);
        var leftCamera = cameraFromViewProj(viewL, projL);
        renderer.render(scene, leftCamera); 
    
		gl.colorMask(0, 1, 1, 0);
		var eyeRPos = getRightEyePosition();
		var viewR = displaySurface.viewMatrix(eyeRPos);
		var projR = displaySurface.projectionMatrix(eyeRPos, 1, 10000);
        var rightCamera = cameraFromViewProj(viewR, projR);
        renderer.clearDepth();
        renderer.render(scene, rightCamera); 
		
        gl.colorMask(1, 1, 1, 1);
    }
    
    renderer.setRenderTarget(null);
    renderer.setClearColor(0x000000);
  
    renderer.render(displaySurfaceScene, camera);
    renderer.render(eyeScene, camera);	
};

window.addEventListener( 'keydown', function ( event ) 
{
    switch ( event.code ) {
        case 'KeyL': 
            var eye = getLeftEyePosition();
            camera.position.set(eye.x, eye.y, eye.z); 
            break;
            
        case 'KeyR': 
            var eye = getRightEyePosition();
            camera.position.set(eye.x, eye.y, eye.z); 
            break;
            
        case 'KeyS':
            showScene = !showScene;
            break;
            
        case 'KeyT':
            var viewF = displaySurfaces[0].viewMatrix(new THREE.Vector3(50,20,100));
            var viewL = displaySurfaces[1].viewMatrix(new THREE.Vector3(50,20,100));
            var viewR = displaySurfaces[2].viewMatrix(new THREE.Vector3(50,20,100));
            var viewB = displaySurfaces[3].viewMatrix(new THREE.Vector3(50,20,100));
            console.log("View matrices:", viewF, viewL, viewR, viewB);
            break;
    }
});

async function initApp() {
    createRenderer();  			
    createDisplaySurfaces();	
    createDisplaySurfaceTargets(); 
    createDisplaySurfaceScene();	
    createEyeScene();	
    createScene();		

    try {
        // 1. Load Flamingo (Left side)
        const flamingo = await loadBird('models/Flamingo.glb', { x: -60, y: 30, z: -70 }, 0.25);
        scene.add(flamingo.model);
        birdUpdaters.push(flamingo.tick);

        // 2. Load Stork (Center/Right side)
        const stork = await loadBird('models/Stork.glb', { x: 0, y: 40, z: -100 }, 0.25);
        scene.add(stork.model);
        birdUpdaters.push(stork.tick);

        // 3. Load Parrot (Far right side)
        const parrot = await loadBird('models/Parrot.glb', { x: 60, y: 15, z: -50 }, 0.5);
        scene.add(parrot.model);
        birdUpdaters.push(parrot.tick);

        console.log("All birds loaded successfully!");
    } catch (e) {
        console.warn("Could not load bird models (check file names and local server directory):", e);
    }

    createCamera();		
    window.addEventListener('resize', onWindowResize);
    enableOrbitCamera(camera, renderer);  
    setupDragControls();  

    renderer.setAnimationLoop(animate);
}

initApp();

const ipdSlider = document.getElementById('ipdSlider');
const ipdVal = document.getElementById('ipdVal');

if (ipdSlider) {
    ipdSlider.addEventListener('input', function(event) {
        var newIPD = parseFloat(event.target.value);
        ipdVal.innerText = newIPD;

        var head = eyeScene.getObjectByName("Head");
        if (head) {
            var eyeL = head.getObjectByName("EyeL");
            var eyeR = head.getObjectByName("EyeR");
            if (eyeL && eyeR) {
                eyeL.position.x = -newIPD / 2;
                eyeR.position.x = newIPD / 2;
            }
        }
    });
}
</script>
</body>
</html>
