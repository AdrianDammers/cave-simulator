<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CAVE simulator</title>
<script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.186.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.186.0/examples/jsm/"
            }
        }
    </script>
  <script type="module" crossorigin src="/assets/index-9lFng7aZ.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Dd6lRqA4.css">
</head>
<body>
    <div id="info">
        CAVE Simulator. The head and teapot are draggable. <br />
        "L" See from Left Eye | "R" See from Right Eye | "S" toggle show scene  <br />

        IPD:
        <input type="range" id="ipdSlider" min="2" max="30" step="0.2" value="6.8"><span id="ipdValue">6.8</span> cm
        <strong>Teapot parallax (Front wall):</strong>
        <span id="parallaxInfo">Calculating...</span> <br />

        Scene scale:
        <input type="range" id="scaleSlider" min="0.25" max="2" step="0.05" value="1"> <span id="scaleValue">1.00</span>x <br/>

        Scene position:<br>
        X: <input type="range" id="sceneX" min="-150" max="150" step="5" value="0"><span id="valueX">0</span> cm
        Y: <input type="range" id="sceneY" min="-150" max="150" step="5" value="0"><span id="valueY">0</span> cm
        Z: <input type="range" id="sceneZ" min="-150" max="150" step="5" value="0"><span id="valueZ">0</span> cm
    </div>

    <!-- Check: https://threejs.org/docs/index.html#manual/en/introduction/Installation 
    for alternative installations -->

    <!---->

</body>
</html>
